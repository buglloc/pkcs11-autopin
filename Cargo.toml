[package]
name = "pkcs11-autopin"
version = "0.1.0"
edition = "2021"
description = "PKCS#11 proxy library with automatic PIN entry"
license = "MIT"
authors = ["buglloc"]

[lib]
name = "pkcs11_autopin"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
noyalib = "0.0.6"
libloading = "0.8"
log = "0.4"
env_logger = "0.11"
once_cell = "1.19"
parking_lot = "0.12"
zeroize = "1.8"

[profile.release]
lto = true
strip = true
opt-level = "z"
